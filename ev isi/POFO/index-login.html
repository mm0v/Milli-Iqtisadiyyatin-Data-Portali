<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG IN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="Assets/bootstrap5/css/bootstrap.min.css">
    <link rel="stylesheet" href="Assets/login-css/style-login.css">
</head>

<body>
    <section class="login-page">
        <div class="login">
            <div class="text">
                <h1>USER LOGIN</h1>
                <form action="">
                    <div class="alert" id="alert-fill" role="alert">
                        <h5>Please Fill the empty spaces!</h5>
                        <button type="button" class="btn" data-bs-dismiss="alert">Close</button>
                    </div>
                    <div class="alert" id="alert-success" role="alert">
                        <div class="icon" class="green">
                            <i class="fa-regular fa-circle-check"></i>
                        </div>
                        <div class="content">
                            <h3>Success</h3>
                            <p>Your account has been saved</p>
                        </div>
                        <button type="button" class="btn" data-bs-dismiss="alert">Close</button>
                    </div>
                    <div class="alert" id="alert-warning" role="alert">
                        <div class="icon" id="red">
                            <i class="fa-regular fa-circle-xmark"></i>
                        </div>
                        <div class="content">
                            <h3>Error</h3>
                            <p>Your email address is invalid</p>
                        </div>
                        <button type="button" class="btn" data-bs-dismiss="alert">Close</button>
                    </div>
                    <div class="user">
                        <img src="Assets/img/user.png" alt="">
                        <input type="text" placeholder="Username">
                    </div>
                    <div class="password">
                        <input type="password" placeholder="Password">
                        <button class="lock">
                            <img src="Assets/img/unlock.png" alt="">
                        </button>
                    </div>
                    <button class="submit">LOGIN</button>
            </div>
            </form>
        </div>
    </section>


    <script src="Assets/bootstrap5/js/bootstrap.bundle.min.js"></script>
    <script src="Assets/login-js/script-login.js"></script>
</body>

</html>
