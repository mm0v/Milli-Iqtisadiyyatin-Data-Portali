<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!---------------------------------------Thin Box--------------------------------------->
    <div class="thin-box">
        <div class="inside-box">Page Header</div>
        <div class="inside-box">Nav</div>
        <div class="article">
            <p>Article</p>
            <div class="article-header">Article Header</div>
            <div class="main">Main</div>
        </div>
        <div class="inside-box">Section</div>
        <div class="inside-box">Aside</div>
        <div class="inside-box">Footer</div>
    </div>
<!---------------------------------------Medium Box-------------------------------------->
    <div class="medium-box">
        <div class="inside-box">Page Header</div>
        <div class="inside-box">Nav</div>
        <div class="container">
            <div class="article">Article
                <div class="article-header">Article Header</div>
                <div class="main">Main</div>
            </div>
            <div class="aside-box">Aside</div>
        </div>
        <div class="inside-box">Section</div>
        <div class="inside-box">Aside</div>
        <div class="inside-box">Footer</div>
    </div>
<!---------------------------------------Large Box--------------------------------------->
<div class="large-box">
    <div class="inside-box">Page Header</div>
    <div class="inside-box">Nav</div>
    <div class="container">
        <div class="left-side-of-box">
            <div class="article">Article
                <div class="article-header">Article Header</div>
                <div class="main">Main</div>
            </div>
            <div class="section-box">Section</div>
        </div>
        <div class="right-side-of-box">
            <div class="little-aside-boxes">
                <div class="aside-box" id="first">Aside</div>
                <div class="aside-box">Aside</div>
            </div>
            <div class="big-aside-box">Aside</div>
        </div>
    </div>
    <div class="inside-box">Aside</div>
    <div class="inside-box">Footer</div>
</div>
</body>
</html>
