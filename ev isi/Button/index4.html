<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Novell Services Login</h1>
    <form action="">
    <table>
        <tr>
            <td>Username:</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Password:</td>
            <td><input type="password"</td>
        </tr>
        <tr>
            <td>City of employment:</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Web Server:</td>
            <td><select>
                <option type="Node.js">Node.js</option>
                <option type="Apache">Apache</option>
                <option type="ISS">IIS</option>
            </select></td>
        </tr>
        <tr>
            <td>Please specify<br>your role:</td>
            <td><label for="Admin">Admin</label>
                    <input type="radio" id="admin" name="role">
                <label for="female">Engineer</label>
                    <input type="radio" id="engineer" name="role">
                <label for="female">Manager</label>
                    <input type="radio" id="manager" name="role">
                <label for="female">Guest</label>
                    <input type="radio" id="guest" name="role">
            </td>
        </tr>
        <tr>
            <td>Single Sign-onto<br> the following</td>
            <td><label for="Mail">Mail</label>
                <input type="checkbox">
            <label for="Payroll">Payroll</label>
                <input type="checkbox">
            <label for="Self-Service">Self-Service</label>
                <input type="checkbox"></td>
        </tr>
    </table>
    <input type="submit" value="Login">
    <input type="reset" value="Reset">
</form>
</body>
</html>
