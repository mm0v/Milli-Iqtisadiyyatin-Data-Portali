<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Feedback Form</h1>
    <form action="">
    <ul>
        <li>Name: <input type="text"></li>
        <li>Email: <input type="email"></li>
        <li>Password: <input type="password"></li>
        <li>Please check all the emotions that apply to you:
            <ul type="disc">
        <li><input type="checkbox">Angry</li>
        <li><input type="checkbox">Sad</li>
        <li><input type="checkbox">Happy</li>
        <li><input type="checkbox">Ambivalent</li>
            </ul>
        </li>
        <li>How satisfied were you with our service?
            <ul type="disc">
        <li><label for="Very Satisfied">Very Satisfied</label>
            <input type="radio" id="1" name="all"></li>
        <li><label for="Satisfied">Satisfied</label>
            <input type="radio" id="2" name="all"></li>
        <li><label for="Didn't care">Didn't care</label>
            <input type="radio" id="3" name="all"></li>
        <li><label for="Dissatisfied">Dissatisfied</label>
            <input type="radio" id="4" name="all"></li>
        <li><label for="Very dissatisfied">Very dissatisfied</label>
            <input type="radio" id="5" name="all"></li>
            </ul>
        </li>
        <li>Further comments: <textarea></textarea></li>
        <li>Bio Photo: <input type="text">
            <label type="file"></label>
                           <input type="file" id="file" name="file"></li>
        <li>Location visited: <select>
            <option type="Here">Here</option>
            <option type="There">There</option>
            <option type="or there">Or There</option>
        </select></li>
        <li><input type="submit" value="Submit"></li>
    </ul>
    </form>
</body>
</html>
