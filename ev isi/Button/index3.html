<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration Form: Dance Club</h1>
    <form action="">
    <table border="1">
        <tr>
            <td>Name:</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>IC No:</td>
            <td><input type="text" maxlength="5">
            <input type="text" maxlength="3">
            <input type="text" maxlength="4"></td>
        </tr>
        <tr>
            <td>Adress:</td>
            <td><textarea></textarea></td>
        </tr>
        <tr>
            <td>Gender:</td>
            <td><label for="male">Male</label>
                <input type="radio" id="male" name="gender">
                    <label for="female">Female</label>
                <input type="radio" id="female" name="gender"></td>
        </tr>
        <tr>
            <td>Dance Type:</td>
            <td><label for="Zapin">Zapin</label>
                <input type="checkbox">
                <label for="Joget">Joget</label>
                <input type="checkbox">
                <label for="Inang">Inang</label>
                <input type="checkbox">
                <label for="Lion Dance">Lion Dance</label>
                <input type="checkbox"></td>
        </tr>
        <tr>
            <td>Competition:</td>
            <td><select>
                <option value="State Level">State Level</option>
                <option value="Nation Level">Nation level</option>
                <option value="State International Level">State International Level</option>
            </select></td>
        </tr>
        <tr>
            <td>Nationality</td>
            <td><select><option value="Azerbaycan">Azerbaycan</option>
            <option value="Turkiye">Turkiye</option>
            <option value="Ghana">Ghana</option></select>
            </td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password"></td>
        </tr>
    </table>
    <input type="Submit" value="Register me">
    <input type="reset" value="Cancel">
    </form>
</body>
</html>
